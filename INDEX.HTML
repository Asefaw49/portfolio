<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Signup</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(120deg,#4a6cf7,#2f80ed);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    display:flex;
    gap:30px;
}

.card{
    background:#fff;
    width:300px;
    padding:25px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    text-align:center;
}

h2{
    margin-bottom:15px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:5px;
}

.btn{
    width:100%;
    padding:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    margin-top:10px;
    cursor:pointer;
}

.btn:hover{
    background:#0056b3;
}

a{
    color:#007bff;
    text-decoration:none;
}

.divider{
    margin:15px 0;
    font-size:12px;
    color:gray;
}

.fb,.google{
    width:100%;
    padding:8px;
    margin-top:8px;
    border:1px solid #ddd;
    border-radius:5px;
    background:white;
    cursor:pointer;
}

.fb{color:#3b5998;}
.google{color:#db4437;}

@media(max-width:768px){
    .container{
        flex-direction:column;
    }
}
</style>

</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div class="card">
        <h2>Login</h2>
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">

        <a href="#">Forgot password?</a>

        <button class="btn">Login</button>

        <p>Don't have account? <a href="#">Signup</a></p>

        <div class="divider">Or</div>

        <button class="fb">Login with Facebook</button>
        <button class="google">Login with Google</button>
    </div>

    <!-- SIGNUP -->
    <div class="card">
        <h2>Signup</h2>

        <input type="email" placeholder="Email">
        <input type="password" placeholder="Create password">
        <input type="password" placeholder="Confirm password">

        <button class="btn">Signup</button>

        <p>Already have account? <a href="#">Login</a></p>

        <div class="divider">Or</div>

        <button class="fb">Login with Facebook</button>
        <button class="google">Login with Google</button>
    </div>

</div>

</body>
</html>
